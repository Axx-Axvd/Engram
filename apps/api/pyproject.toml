[project]
name = "engram"
version = "0.1.0"
description = "Evidence-backed change-impact analysis with provenance and bounded context packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real local embeddings (ONNX, downloads a model on first use). Enable with: uv sync --extra local
local = ["fastembed>=0.4"]
# Real LLM via the subscription-authenticated Claude CLI. Enable with: uv sync --extra llm
llm = ["claude-agent-sdk>=0.1.0"]
# MCP stdio channel for external agents. Enable with: uv sync --extra mcp
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
